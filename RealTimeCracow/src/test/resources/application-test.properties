spring.application.name=RealTimeCracow-Test

# GTFS API
gtfs.base-url=https://gtfs.ztp.krakow.pl
# SQLite in-memory for tests
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable scheduled refresh in tests
gtfs.refresh.on-startup=false
gtfs.refresh.cron=0 0 0 31 2 *

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Spring AI

spring.ai.mcp.server.name=realtime-cracow-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message