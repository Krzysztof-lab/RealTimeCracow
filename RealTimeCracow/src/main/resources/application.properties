spring.application.name=RealTimeCracow

# GTFS API
gtfs.base-url=https://gtfs.ztp.krakow.pl
gtfs.gtfs-folder=gtfs/

# SQLite Database
gtfs.database.path=./data/gtfs.db
spring.datasource.url=jdbc:sqlite:${gtfs.database.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# GTFS Refresh Schedule (every 6 hours)
gtfs.refresh.cron=0 0 */6 * * *
gtfs.refresh.on-startup=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
